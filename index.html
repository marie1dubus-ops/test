<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; width: 100vw; height: 100vh; }
    #video {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }
    #log {
      position: fixed; top: 10px; left: 10px;
      z-index: 99;
      background: rgba(0,0,0,0.8);
      color: lime; padding: 10px;
      font-size: 13px; font-family: monospace;
      border-radius: 8px; max-width: 90vw;
      max-height: 50vh; overflow-y: auto;
    }
  </style>
</head>
<body>

<div id="log">Loading...<br></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
window.onerror = (msg, src, line) => log('🔴 ERROR: ' + msg + ' (line ' + line + ')');
window.addEventListener('unhandledrejection', e => log('🔴 PROMISE ERROR: ' + e.reason));

const log = msg => {
  const el = document.getElementById('log');
  el.innerHTML += msg + '<br>';
  el.scrollTop = el.scrollHeight;
  console.log(msg);
};

log('Script loaded ✅');

renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);
