<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; width: 100vw; height: 100vh; }
    #video {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }
    #log {
      position: fixed; top: 10px; left: 10px;
      z-index: 99;
      background: rgba(0,0,0,0.8);
      color: lime; padding: 10px;
      font-size: 13px; font-family: monospace;
      border-radius: 8px; max-width: 90vw;
      max-height: 40vh; overflow-y: auto;
    }
    #tapbtn {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 50;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 28px;
      font-family: sans-serif;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="log">Loading...<br></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<!-- Fullscreen tap overlay — only needed for iOS orientation permission -->
<div id="tapbtn">Tap anywhere to start AR</div>

<script>
window.onerror = (msg, src, line) => log('🔴 ERROR: ' + msg + ' (line ' + line + ')');
window.addEventListener('unhandledrejection', e => log('🔴 PROMISE ERROR: ' + e.reason));

const log = msg => {
  const el = document.getElementById('log');
  el.innerHTML += msg + '<br>';
  el.scrollTop = el.scrollHeight;
  console.log(msg);
};

log('Script loaded ✅');

// ── Three.js ──────────────────────────────────────────────────
let renderer, scene, camera;
const canvas = document.getElementById('canvas');
renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);
scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 0, 0);
scene.add(camera);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(100, 200, 100);
scene.add(sun);
log('Three.js ready ✅');

// ── Load model ────────────────────────────────────────────────
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const loader = new THREE.GLTFLoader();
loader.setDRACOLoader(dracoLoader);

log('Loading model...');
loader.load(
  './assets/test-cube.glb',
  gltf => {
    const model = gltf.scene;
    model.position.set(0, -3, -10);
    scene.add(model);
    log('Model loaded ✅');
  },
  xhr => log('Loading: ' + Math.round(xhr.loaded / 1024) + 'KB...'),
  err => log('❌ Model failed: ' + (err.message || JSON.stringify(err)))
);

// ── Render loop ───────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
log('Render loop ✅');

// ── Camera ────────────────────────────────────────────────────
function startCamera() {
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment' },
    audio: false
  })
  .then(stream => {
    document.getElementById('video').srcObject = stream;
    log('Camera ✅');
  })
  .catch(err => log('❌ Camera: ' + err.name + ' — ' + err.message));
}

// ── GPS ───────────────────────────────────────────────────────
function startGPS() {
  navigator.geolocation.getCurrentPosition(
    pos => log('GPS ✅ ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5)),
    err => log('❌ GPS: ' + err.message),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ── Orientation ───────────────────────────────────────────────
function attachOrientation() {
  let eventCount = 0;
  window.addEventListener('deviceorientation', e => {
    eventCount++;
    const heading = e.webkitCompassHeading != null
      ? e.webkitCompassHeading
      : (360 - (e.alpha || 0));
    const tilt = e.beta != null ? e.beta : 90;

    if (eventCount % 30 === 0) {
      log('heading: ' + heading.toFixed(1) + ' tilt: ' + tilt.toFixed(1));
    }

    camera.rotation.order = 'YXZ';
    camera.rotation.y = -(heading * Math.PI / 180);
    camera.rotation.x = ((tilt - 90) * Math.PI / 180);
  });
  log('Orientation attached ✅');
}

// ── Tap handler — must be first thing on tap for iOS ─────────
document.getElementById('tapbtn').addEventListener('click', () => {
  log('Tapped ✅');
  document.getElementById('tapbtn').style.display = 'none';

  // Request orientation FIRST, right inside the tap handler
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        log('Orientation permission: ' + state);
        attachOrientation();
      })
      .catch(err => log('❌ Orientation: ' + err.message));
  } else {
    log('Orientation: no permission needed');
    attachOrientation();
  }

  // Camera and GPS start immediately on tap too
  startCamera();
  startGPS();
});
</script>
</body>
</html>
