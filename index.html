<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; width: 100vw; height: 100vh; }
    #video {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }
    #log {
      position: fixed; top: 10px; left: 10px;
      z-index: 99;
      background: rgba(0,0,0,0.8);
      color: lime; padding: 10px;
      font-size: 13px; font-family: monospace;
      border-radius: 8px; max-width: 90vw;
      max-height: 50vh; overflow-y: auto;
    }
    #btn {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      z-index: 99; padding: 16px 40px;
      font-size: 18px; border: none;
      border-radius: 12px; background: white;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="log">Waiting for tap...<br></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<button id="btn">Start AR</button>

<script>
window.onerror = (msg, src, line) => log('🔴 ERROR: ' + msg + ' (line ' + line + ')');
window.addEventListener('unhandledrejection', e => log('🔴 PROMISE ERROR: ' + e.reason));
  
const log = msg => {
  const el = document.getElementById('log');
  el.innerHTML += msg + '<br>';
  el.scrollTop = el.scrollHeight;
  console.log(msg);
};

log('Script loaded ✅');
  log('THREE loaded: ' + (typeof THREE !== 'undefined' ? '✅' : '❌'));
log('GLTFLoader loaded: ' + (typeof THREE !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined' ? '✅' : '❌'));

let renderer, scene, camera;
try {
  const canvas = document.getElementById('canvas');
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
  scene.add(camera);
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(100, 200, 100);
  scene.add(sun);
  log('Three.js ready ✅');
} catch(e) {
  log('❌ Three.js failed: ' + e.message);
}

try {
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new THREE.GLTFLoader();
loader.setDRACOLoader(dracoLoader);
  log('Loading model...');
  loader.load(
    './assets/test-cube.glb',
    gltf => {
      const model = gltf.scene;
      model.position.set(0, 0, -5);
      scene.add(model);
      log('Model loaded ✅');
    },
    xhr => {
      if (xhr.total > 0) {
        log('Loading: ' + Math.round(xhr.loaded / xhr.total * 100) + '%');
      } else {
        log('Loading: ' + Math.round(xhr.loaded / 1024) + 'KB...');
      }
    },
    err => log('❌ Model failed: ' + (err.message || JSON.stringify(err)))
  );
} catch(e) {
  log('❌ Model exception: ' + e.message);
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
log('Render loop running ✅');

document.getElementById('btn').addEventListener('click', () => {
  log('Button tapped ✅');
  document.getElementById('btn').style.display = 'none';
  step1_orientation();
});

function step1_orientation() {
  log('Step 1: orientation...');
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        log('Orientation: ' + state);
        attachOrientation();
        step2_camera();
      })
      .catch(err => {
        log('❌ Orientation: ' + err.message);
        step2_camera();
      });
  } else {
    log('Orientation: no permission needed');
    attachOrientation();
    step2_camera();
  }
}

function attachOrientation() {
  window.addEventListener('deviceorientation', e => {
    const heading = e.webkitCompassHeading != null ? e.webkitCompassHeading : (360 - (e.alpha || 0));
    const tilt = e.beta != null ? e.beta : 90;
    camera.rotation.order = 'YXZ';
    camera.rotation.y = -(heading * Math.PI / 180);
    camera.rotation.x = ((tilt - 90) * Math.PI / 180);
  });
  log('Orientation attached ✅');
}

function step2_camera() {
  log('Step 2: camera...');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(stream => {
      document.getElementById('video').srcObject = stream;
      log('Camera ✅');
      step3_gps();
    })
    .catch(err => {
      log('❌ Camera: ' + err.name + ' — ' + err.message);
      step3_gps();
    });
}

function step3_gps() {
  log('Step 3: GPS...');
  navigator.geolocation.getCurrentPosition(
    pos => log('GPS ✅ ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5)),
    err => log('❌ GPS: ' + err.message),
    { enableHighAccuracy: true, timeout: 10000 }
  );
  log('All steps done ✅');
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
