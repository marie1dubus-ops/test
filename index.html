<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; width: 100vw; height: 100vh; }
    #video {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    #canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }
    #log {
      position: fixed; top: 10px; left: 10px;
      z-index: 99;
      background: rgba(0,0,0,0.8);
      color: lime; padding: 10px;
      font-size: 13px; font-family: monospace;
      border-radius: 8px; max-width: 90vw;
      max-height: 50vh; overflow-y: auto;
    }
  </style>
</head>
<body>

<div id="log">Loading...<br></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
window.onerror = (msg, src, line) => log('🔴 ERROR: ' + msg + ' (line ' + line + ')');
window.addEventListener('unhandledrejection', e => log('🔴 PROMISE ERROR: ' + e.reason));

const log = msg => {
  const el = document.getElementById('log');
  el.innerHTML += msg + '<br>';
  el.scrollTop = el.scrollHeight;
  console.log(msg);
};

log('Script loaded ✅');

// ── Three.js setup ────────────────────────────────────────────
let renderer, scene, camera;
const canvas = document.getElementById('canvas');
renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);

scene = new THREE.Scene();

// Camera represents your eye / phone position
camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 0, 0); // camera stays at origin
scene.add(camera);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(100, 200, 100);
scene.add(sun);
log('Three.js ready ✅');

// ── Load model ────────────────────────────────────────────────
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const loader = new THREE.GLTFLoader();
loader.setDRACOLoader(dracoLoader);

log('Loading model...');
loader.load(
  './assets/test-cube.glb',
  gltf => {
    const model = gltf.scene;
    // Place model 10 meters north (negative Z) and 3 meters below eye level
    model.position.set(0, -3, -10);
    scene.add(model);
    log('Model loaded ✅ — walk around to see it in 3D');
  },
  xhr => log('Loading: ' + Math.round(xhr.loaded / 1024) + 'KB...'),
  err => log('❌ Model failed: ' + (err.message || JSON.stringify(err)))
);

// ── Render loop ───────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
log('Render loop ✅');

// ── Orientation (compass + tilt) ──────────────────────────────
function startOrientation() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        log('Orientation: ' + state);
        if (state === 'granted') attachOrientation();
      })
      .catch(err => log('❌ Orientation: ' + err.message));
  } else {
    log('Orientation: auto ✅');
    attachOrientation();
  }
}

function attachOrientation() {
  let eventCount = 0;
  window.addEventListener('deviceorientation', e => {
    eventCount++;
    const heading = e.webkitCompassHeading != null
      ? e.webkitCompassHeading
      : (360 - (e.alpha || 0));
    const tilt = e.beta != null ? e.beta : 90;

    // Show raw values every 30 events so we can see what's coming in
    if (eventCount % 30 === 0) {
      log('compass: ' + (e.webkitCompassHeading != null ? e.webkitCompassHeading.toFixed(1) : 'null') +
          ' alpha: ' + (e.alpha != null ? e.alpha.toFixed(1) : 'null') +
          ' beta: ' + (tilt.toFixed(1)));
    }

    camera.rotation.order = 'YXZ';
    camera.rotation.y = -(heading * Math.PI / 180);
    camera.rotation.x = ((tilt - 90) * Math.PI / 180);
  });
  log('Orientation attached ✅');
}

// ── Camera (video passthrough) ────────────────────────────────
function startCamera() {
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment' },
    audio: false
  })
  .then(stream => {
    document.getElementById('video').srcObject = stream;
    log('Camera ✅');
  })
  .catch(err => log('❌ Camera: ' + err.name + ' — ' + err.message));
}

// ── GPS ───────────────────────────────────────────────────────
function startGPS() {
  navigator.geolocation.getCurrentPosition(
    pos => log('GPS ✅ ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5)),
    err => log('❌ GPS: ' + err.message),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ── Auto start everything ─────────────────────────────────────
setTimeout(() => {
  log('Starting AR...');
  startOrientation();
  startCamera();
  startGPS();
}, 500);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
